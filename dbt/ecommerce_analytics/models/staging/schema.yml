version: 2

models:

  # ==========================================================
  # CUSTOMERS
  # ==========================================================

  - name: stg_customers
    description: "Cleaned and standardized customer data."

    columns:

      - name: customer_id
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        tests:
          - not_null

      - name: customer_state
        tests:
          - not_null


  # ==========================================================
  # ORDERS
  # ==========================================================

  - name: stg_orders
    description: "Cleaned order-level data."

    columns:

      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null

      - name: order_purchase_timestamp
        tests:
          - not_null


  # ==========================================================
  # ORDER ITEMS
  # ==========================================================

  - name: stg_order_items
    description: "Cleaned order item data. Grain: one row per order item."

    columns:

      - name: order_id
        tests:
          - not_null

      - name: order_item_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: seller_id
        tests:
          - not_null


  # ==========================================================
  # PAYMENTS
  # ==========================================================

  - name: stg_payments
    description: "Cleaned payment data. Grain: one row per payment record."

    columns:

      - name: order_id
        tests:
          - not_null

      - name: payment_sequential
        tests:
          - not_null

      - name: payment_value
        tests:
          - not_null


  # ==========================================================
  # PRODUCTS
  # ==========================================================

  - name: stg_products
    description: "Cleaned product master data."

    columns:

      - name: product_id
        tests:
          - not_null
          - unique


  # ==========================================================
  # SELLERS
  # ==========================================================

  - name: stg_sellers
    description: "Cleaned seller master data."

    columns:

      - name: seller_id
        tests:
          - not_null
          - unique

      - name: seller_state
        tests:
          - not_null


  # ==========================================================
  # REVIEWS
  # ==========================================================

  - name: stg_reviews
    description: "Cleaned customer review data."

    columns:

      - name: review_id
        tests:
          - not_null

      - name: order_id
        tests:
          - not_null

      - name: review_score
        tests:
          - not_null


  # ==========================================================
  # GEOLOCATION
  # ==========================================================

  - name: stg_geolocation
    description: "Deduplicated Brazilian geolocation data."

    columns:

      - name: geolocation_zip_code_prefix
        tests:
          - not_null

      - name: geolocation_lat
        tests:
          - not_null

      - name: geolocation_lng
        tests:
          - not_null


  # ==========================================================
  # CATEGORY TRANSLATION
  # ==========================================================

  - name: stg_category_translation
    description: "Product category translation from Portuguese to English."

    columns:

      - name: product_category_name
        tests:
          - not_null
          - unique

      - name: product_category_name_english
        tests:
          - not_null