version: 2

models:

  # ==========================================================
  # DIM CUSTOMERS
  # ==========================================================

  - name: dim_customers
    description: >
      Customer dimension. Grain is one row per unique customer.
      customer_unique_id is used as the business customer identity.

    columns:

      - name: customer_key
        description: "Surrogate key for customer."
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Business identifier representing a unique customer."
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Representative Olist customer record identifier."

      - name: customer_state
        description: "Customer state."

      - name: total_orders
        description: "Number of distinct orders associated with the customer."


  # ==========================================================
  # DIM PRODUCTS
  # ==========================================================

  - name: dim_products
    description: "Product dimension. Grain is one row per product."

    columns:

      - name: product_key
        tests:
          - not_null
          - unique

      - name: product_id
        tests:
          - not_null
          - unique

      - name: product_category_name
        description: "Original Portuguese product category."

      - name: product_category_name_english
        description: "Translated English product category."


  # ==========================================================
  # DIM SELLERS
  # ==========================================================

  - name: dim_sellers
    description: "Seller dimension. Grain is one row per seller."

    columns:

      - name: seller_key
        tests:
          - not_null
          - unique

      - name: seller_id
        tests:
          - not_null
          - unique

      - name: seller_state
        tests:
          - not_null


  # ==========================================================
  # FACT ORDERS
  # ==========================================================

  - name: fact_orders
    description: >
      Order-level fact table. Grain is one row per order.
      Item and payment values are aggregated before joining
      to prevent fan-out and duplicated revenue.

    columns:

      - name: order_key
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_key

      - name: order_date
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null

      - name: total_price
        tests:
          - not_null

      - name: total_freight
        tests:
          - not_null

      - name: total_payment
        tests:
          - not_null


  # ==========================================================
  # FACT ORDER ITEMS
  # ==========================================================

  - name: fact_order_items
    description: >
      Order item fact table. Grain is one row per item within an order.

    columns:

      - name: order_item_key
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: order_item_id
        tests:
          - not_null

      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key

      - name: seller_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_key

      - name: price
        tests:
          - not_null

      - name: freight_value
        tests:
          - not_null


  # ==========================================================
  # FACT PAYMENTS
  # ==========================================================

  - name: fact_payments
    description: >
      Payment fact table. Grain is one row per payment record.

    columns:

      - name: payment_key
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: payment_sequential
        tests:
          - not_null

      - name: payment_value
        tests:
          - not_null


  # ==========================================================
  # FACT REVIEWS
  # ==========================================================

  - name: fact_reviews
    description: >
      Customer review fact table. Grain is one row per review record.

    columns:

      - name: review_key
        tests:
          - not_null
          - unique

      - name: review_id
        tests:
          - not_null

      - name: order_id
        tests:
          - not_null

      - name: review_score
        tests:
          - not_null